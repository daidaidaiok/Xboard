name: Security Audit

on:
  schedule:
    - cron: "0 2 * * 1"   # 每周一
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Composer audit (已知漏洞依赖)
        run: composer audit --locked
      - name: Gitleaks (密钥泄露)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
